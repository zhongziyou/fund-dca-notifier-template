name: 定投日报

on:
  schedule:
    # UTC 06:30 = 北京时间 14:30（赶在 15:00 收盘前操作）。
    # "1-5" = 周一至周五（周末休市，无需发送）。
    # 注意：GitHub Actions 定时任务可能有几分钟到半小时延迟，
    # 若担心赶不上 15:00，可把分钟改小，如 "20 6 * * 1-5" = 14:20。
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行日报并发送邮件
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main.py

      - name: 提交触发状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json 无变化，跳过提交"
          else
            git commit -m "update state [skip ci]"
            git push
          fi
